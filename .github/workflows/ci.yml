name: Build and test

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: beyond-the-veil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build and test
        run: gradle --no-daemon clean build

      - name: Generate artifact checksum
        run: sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-veil-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
